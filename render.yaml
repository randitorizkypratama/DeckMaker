# DuelDex - Render deployment
#
# Two independent services from one monorepo. Both build from the repo root so
# Bun can resolve the workspace packages (packages/shared), then run from their
# own app directory.
#
# DATABASE: Uses Turso (libSQL) for persistent, serverless SQLite.
# 1. Create a Turso database: turso db create dueldex
# 2. Get the URL: turso db show dueldex --url
# 3. Create a token: turso db tokens create dueldex
# 4. Set TURSO_DATABASE_URL and TURSO_AUTH_TOKEN in Render env vars.

services:
  # ---------------------------------------------------------------- API
  - type: web
    name: dueldex-api
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: |
      curl -fsSL https://bun.sh/install | bash
      export PATH="$HOME/.bun/bin:$PATH"
      bun install
    startCommand: |
      export PATH="$HOME/.bun/bin:$PATH"
      bun run apps/api/src/index.ts
    healthCheckPath: /health
    envVars:
      - key: API_PORT
        value: 10000
      - key: YGOPRODECK_API_URL
        value: https://db.ygoprodeck.com/api/v7
      - key: CACHE_TTL_MS
        value: 3600000
      - key: UPSTREAM_TIMEOUT_MS
        value: 12000
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # Set to the deployed web URL once it is known.
      - key: CORS_ORIGIN
        value: https://dueldex-web.onrender.com
      - key: PUBLIC_WEB_URL
        value: https://dueldex-web.onrender.com
      - key: JWT_SECRET
        sync: false

  # ---------------------------------------------------------------- Web
  - type: web
    name: dueldex-web
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: |
      curl -fsSL https://bun.sh/install | bash
      export PATH="$HOME/.bun/bin:$PATH"
      export NODE_OPTIONS="--max-old-space-size=400"
      bun install
      bun run --cwd apps/web build
    startCommand: node apps/web/.output/server/index.mjs
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NITRO_PORT
        value: 10000
      # Set to the deployed API URL, e.g. https://dueldex-api.onrender.com
      - key: NUXT_PUBLIC_API_BASE_URL
        value: https://dueldex-api.onrender.com
